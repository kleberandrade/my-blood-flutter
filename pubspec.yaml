publish_to: none
version: 1.0.0+9
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
dev_dependencies:
  url_launcher_platform_interface: ^2.3.2
  shared_preferences_platform_interface: ^2.4.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
